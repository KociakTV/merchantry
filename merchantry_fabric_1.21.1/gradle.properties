# Pamięć i przyspieszenie Gradle
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# Parchment - czytelne nazwy parametrów w kodzie Minecrafta
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# Środowisko (https://fabricmc.net/develop)
minecraft_version=1.21.1
loader_version=0.19.5
# Minimalna wersja loadera wymagana od graczy (fabric.mod.json)
loader_min_version=0.16.0
loom_version=1.18.2
fabric_version=0.116.17+1.21.1

# Mody do zgodności (wersje z Modrinth)
# JEI ma ten sam numer wersji dla wszystkich loaderów - podajemy ID wersji Fabric z Modrinth (19.57.0.450)
jei_version=Dd2GGBzd
emi_version=1.1.24+1.21.1+fabric

## Właściwości moda
# Musi pasować do stałej MOD_ID w klasie głównej
mod_id=merchantry
mod_name=Merchantry
mod_license=MIT
mod_version=1.0.0
mod_group_id=pl.ktv.merchantry
mod_authors=KociakTV
mod_description=Server-side shop, economy and player market.
