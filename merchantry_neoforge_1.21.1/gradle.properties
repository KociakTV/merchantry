# Pamięć i przyspieszenie Gradle
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Parchment - czytelne nazwy parametrów w kodzie Minecrafta
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# Środowisko
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.248
loader_version_range=[1,)

# Mody do zgodności (wersje z Modrinth)
create_version=6.0.10+mc1.21.1
numismatics_version=1.1.0+neoforge-mc1.21.1
# JEI ma ten sam numer wersji dla Forge i NeoForge - podajemy ID wersji NeoForge z Modrinth (19.57.0.449)
jei_version=TKsCmRlt
emi_version=1.1.24+1.21.1+neoforge

## Właściwości moda
# Musi pasować do stałej MOD_ID w klasie głównej
mod_id=merchantry
mod_name=Merchantry
mod_license=MIT
mod_version=1.0.0
mod_group_id=pl.ktv.merchantry
mod_authors=KociakTV
mod_description=Server-side shop, economy and player market.
