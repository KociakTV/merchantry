# Metadane moda. Zmienne w klamrach są podstawiane z gradle.properties przy budowaniu.
modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
# Ikona na liście modów (pixel art - bez rozmywania)
logoFile="merchantry.png"
logoBlur=false
# Strona moda (CurseForge: https://www.curseforge.com/minecraft/mc-mods/merchantry)
displayURL="https://modrinth.com/mod/merchantry"
issueTrackerURL="https://github.com/KociakTV/merchantry/issues"
# Mod tylko serwerowy - klienci bez moda mogą się łączyć
displayTest="IGNORE_SERVER_VERSION"
description='''
${mod_description}
'''

# Mixiny do innych modów (FTB Chunks, Xaero's Minimap, JourneyMap) - nakładane tylko, gdy dany mod jest zainstalowany
[[mixins]]
    config="merchantry.mixins.json"
[[mixins]]
    config="merchantry.client.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

# Opcjonalnie: Create: Numismatics (kantor dolary - monety)
[[dependencies.${mod_id}]]
    modId="numismatics"
    type="optional"
    versionRange="[1.0.19,)"
    ordering="AFTER"
    side="SERVER"

# Opcjonalnie: Create i dodatki - domyślne oferty
[[dependencies.${mod_id}]]
    modId="create"
    type="optional"
    versionRange="*"
    ordering="NONE"
    side="SERVER"

# Opcjonalnie: Applied Energistics 2 - domyślne oferty
[[dependencies.${mod_id}]]
    modId="ae2"
    type="optional"
    versionRange="*"
    ordering="NONE"
    side="SERVER"

# Opcjonalnie: FTB Ultimine - odblokowanie w sklepie
[[dependencies.${mod_id}]]
    modId="ftbultimine"
    type="optional"
    versionRange="*"
    ordering="NONE"
    side="SERVER"

# Opcjonalnie: Curios - sloty przy ładunku keepInventory
[[dependencies.${mod_id}]]
    modId="curios"
    type="optional"
    versionRange="*"
    ordering="NONE"
    side="SERVER"

# Opcjonalnie: Gravestone - bez grobu po uratowanej śmierci
[[dependencies.${mod_id}]]
    modId="gravestone"
    type="optional"
    versionRange="*"
    ordering="NONE"
    side="SERVER"

# Opcjonalnie: Corpse - bez zwłok po uratowanej śmierci
[[dependencies.${mod_id}]]
    modId="corpse"
    type="optional"
    versionRange="*"
    ordering="NONE"
    side="SERVER"

# Opcjonalnie: You're in Grave Danger - bez grobu po uratowanej śmierci
[[dependencies.${mod_id}]]
    modId="yigd"
    type="optional"
    versionRange="*"
    ordering="NONE"
    side="SERVER"

# Opcjonalnie: FTB Chunks - bez waypointu śmierci
[[dependencies.${mod_id}]]
    modId="ftbchunks"
    type="optional"
    versionRange="*"
    ordering="NONE"
    side="SERVER"

# Opcjonalnie: Xaero's Minimap - bez deathpointa (gdy Merchantry jest na kliencie)
[[dependencies.${mod_id}]]
    modId="xaerominimap"
    type="optional"
    versionRange="*"
    ordering="NONE"
    side="CLIENT"

# Opcjonalnie: JourneyMap - bez waypointu śmierci (gdy Merchantry jest na kliencie)
[[dependencies.${mod_id}]]
    modId="journeymap"
    type="optional"
    versionRange="*"
    ordering="NONE"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
