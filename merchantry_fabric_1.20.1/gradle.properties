# Pamięć i przyspieszenie Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# Parchment - czytelne nazwy parametrów w kodzie Minecrafta
parchment_minecraft_version=1.20.1
parchment_mappings_version=2023.09.03

# Środowisko (https://fabricmc.net/develop)
minecraft_version=1.20.1
loader_version=0.19.5
# Minimalna wersja loadera wymagana od graczy (fabric.mod.json)
loader_min_version=0.15.0
loom_version=1.18.2
fabric_version=0.92.12+1.20.1

# Mody do zgodności (wersje z Modrinth). Gdy ten sam numer wersji jest dla kilku loaderów,
# podajemy ID wersji Fabric z Modrinth.
# Create Fabric 6.0.8.1 i Create: Numismatics 1.1.0 - kantor oraz domyślne oferty Create
create_version=6.0.8.1+build.1744-mc1.20.1
numismatics_version=1.1.0+fabric-mc1.20.1
# Dodatki Create - tylko domyślne oferty (po ID przedmiotów, bez kompilacji z nimi)
# Create Crafts & Additions fabric-1.20.1-1.3.4, Create: New Age 1.2.0, Create: Crafts & (More) Additions 1.6.0
createaddition_version=KIAYldwh
create_new_age_version=R4ZMqkxF
create_more_additions_version=iwt09ZAL
# Applied Energistics 2 15.4.11 (Fabric) - domyślne oferty AE2
ae2_version=xIOhOI9C
# FTB Ultimine (maven FTB) - kupowane prawo do używania ultimine
ftb_ultimine_version=2001.1.8
ftb_library_version=2001.2.13
architectury_version=9.2.14
# Trinkets 3.7.2 (+ Cardinal Components do kompilacji) - keepInventory obejmuje sloty Trinkets
trinkets_version=AHxQGtuC
cca_version=5.2.0
# Universal Graves 3.0.3 i You're in Grave Danger 2.0.16 - bez grobu po uratowanej śmierci
universal_graves_version=66RxRZcI
yigd_version=FsXdhUb2
# JEI 15.62.0.217 (Fabric) / EMI - przeciąganie przedmiotów do edytora ofert
jei_version=fNAl3RfF
emi_version=1.1.24+1.20.1+fabric

